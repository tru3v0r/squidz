[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squidz"
version = "0.1.0"
description = "Windows controller-to-desktop mapper"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pygame>=2.6,<3", "psutil>=6,<8", "pywin32>=308; sys_platform == 'win32'", "comtypes>=1.4; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
squidz = "squidz.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
